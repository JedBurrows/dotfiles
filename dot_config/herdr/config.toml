# herdr configuration — keybindings aligned to ~/.config/tmux/tmux.conf

[keys]
# matches your tmux prefix (C-Space); herdr only supports one prefix key,
# so the tmux prefix2 (C-b) fallback has no herdr equivalent.
prefix = "ctrl+space"

# focus_pane_left/down/up/right stay at their prefix+h/j/k/l default.
# Direct ctrl+hjkl is handled below via vim-herdr-navigation instead —
# it forwards the chord into Vim/Neovim panes and only moves herdr's
# pane focus when the foreground process isn't Vim.

# matches tmux `bind | split-window -h` (side-by-side) and
# `bind - split-window -v` (stacked)
split_horizontal = "prefix+minus"
split_vertical = "prefix+|"

# matches tmux `bind r source-file ...`; default resize_mode also used
# prefix+r, so it's unbound here to free up the key
reload_config = "prefix+r"
resize_mode = ""

# matches tmux's default `prefix + $` (rename-session)
rename_workspace = "prefix+$"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"

[theme]
name = "gruvbox"
auto_switch = false

[ui.toast]
delivery = "herdr"

[experimental]
pane_history = true

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
